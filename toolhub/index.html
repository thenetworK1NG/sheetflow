<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1a3b">
  <title>Sheetflow Tool Hub</title>
  <style>
    :root {
      --ink: #0c1a3b;
      --ink-soft: #3a4a6b;
      --muted: #6b7a94;
      --faint: #9ca8bd;
      --line: #e2e8f0;
      --paper: #f6f8fb;
      --white: #ffffff;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-pale: #eff6ff;
      --green: #059669;
      --green-pale: #ecfdf5;
      --violet: #7c3aed;
      --violet-pale: #f5f3ff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-width: 320px; margin: 0;
      color: var(--ink); background: var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; border: 0; cursor: pointer; }
    .container { width: min(960px, calc(100% - 48px)); margin: 0 auto; }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(246, 248, 251, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, .7);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; min-height: 64px; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid; grid-template-columns: repeat(3, 4px); align-items: end; gap: 3px;
      width: 26px; height: 26px; padding: 7px 6px; border-radius: 7px; background: var(--ink);
    }
    .brand-mark span { display: block; border-radius: 1.5px; background: #fff; }
    .brand-mark span:nth-child(1) { height: 7px; opacity: .55; }
    .brand-mark span:nth-child(2) { height: 11px; opacity: .75; }
    .brand-mark span:nth-child(3) { height: 15px; background: #6da0ff; }
    .brand-name { color: var(--ink); font-size: 15px; font-weight: 780; letter-spacing: -.05em; }
    .brand-sub { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--line); }
    .nav-links { display: flex; align-items: center; gap: 20px; margin-left: auto; }
    .nav-links a {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 8px;
      color: var(--muted); font-size: 13px; font-weight: 550;
      transition: background .15s, color .15s;
    }
    .nav-links a:hover { color: var(--blue); background: var(--blue-pale); }

    /* Hero */
    .hero {
      padding: 64px 0 48px;
      background: var(--ink);
      color: var(--white);
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px; border-radius: 99px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.7); font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase;
      margin-bottom: 20px;
    }
    .hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #6da0ff; }
    .hero h1 {
      max-width: 540px; margin: 0 0 12px;
      font-size: clamp(36px, 5vw, 56px); font-weight: 740; letter-spacing: -.07em; line-height: 1;
    }
    .hero h1 em { font-style: normal; color: #8db0ff; }
    .hero p { max-width: 480px; margin: 0; color: rgba(255,255,255,.5); font-size: 15px; line-height: 1.65; }
    .hero-count { margin-top: 20px; color: rgba(255,255,255,.35); font-size: 12px; }
    .hero-count strong { color: rgba(255,255,255,.7); }

    /* Tool Grid */
    .tools-section { padding: 48px 0 80px; }
    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 32px; }
    .tool-card {
      display: flex; flex-direction: column;
      padding: 24px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--white);
      transition: box-shadow .2s, border-color .2s;
    }
    .tool-card:hover { box-shadow: 0 8px 24px rgba(12,26,59,.08); border-color: rgba(37,99,235,.15); }
    .tool-card-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
    .tool-card-icon {
      display: grid; width: 44px; height: 44px; place-items: center; flex-shrink: 0;
      border-radius: 11px; background: var(--blue-pale); font-size: 20px;
    }
    .tool-card-info { flex: 1; min-width: 0; }
    .tool-card-info h3 { margin: 0; font-size: 16px; font-weight: 720; letter-spacing: -.02em; }
    .tool-card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tool-card-meta span { color: var(--faint); font-size: 11px; }
    .tool-card-desc { color: var(--muted); font-size: 13px; line-height: 1.6; flex: 1; margin-bottom: 16px; }
    .tool-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
    .tool-tag {
      padding: 3px 8px; border-radius: 5px;
      background: #f1f5f9; color: var(--ink-soft); font-size: 10px; font-weight: 600;
    }
    .tool-tag-active { background: var(--blue); color: #fff; }

    /* Filter bar */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .filter-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--white);
      color: var(--muted); font-size: 11px; font-weight: 650;
      cursor: pointer; transition: all .15s;
    }
    .filter-btn:hover { color: var(--blue); border-color: rgba(37,99,235,.25); }
    .filter-btn-active { color: var(--white); background: var(--blue); border-color: var(--blue); }
    .filter-btn-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px;
      background: rgba(0,0,0,.06); font-size: 9px; font-weight: 700;
    }
    .filter-btn-active .filter-btn-count { background: rgba(255,255,255,.25); }
    .tool-card-actions { display: flex; gap: 8px; margin-top: auto; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 36px; padding: 0 16px; border-radius: 8px;
      font-size: 12px; font-weight: 680; white-space: nowrap;
      transition: background .15s, box-shadow .15s, transform .15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: var(--white); background: var(--blue); box-shadow: 0 4px 12px rgba(37,99,235,.2); }
    .btn-primary:hover { background: var(--blue-dark); box-shadow: 0 6px 16px rgba(37,99,235,.28); }
    .btn-ghost { color: var(--muted); background: transparent; border: 1px solid var(--line); }
    .btn-ghost:hover { color: var(--blue); background: var(--blue-pale); border-color: rgba(37,99,235,.2); }
    .btn-icon { font-size: 14px; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 20px;
      border: 2px dashed var(--line); border-radius: 14px;
      color: var(--muted);
    }
    .empty-state-icon { font-size: 36px; margin-bottom: 12px; opacity: .5; }
    .empty-state h3 { margin: 0 0 6px; font-size: 16px; color: var(--ink-soft); }
    .empty-state p { margin: 0; font-size: 13px; }
    .empty-state code {
      display: inline-block; margin-top: 12px; padding: 6px 12px;
      border-radius: 6px; background: #f1f5f9;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace; font-size: 12px;
    }

    /* Footer */
    .site-footer { border-top: 1px solid var(--line); background: var(--white); }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 80px; }
    .footer-inner p { margin: 0; color: var(--muted); font-size: 11px; }
    .footer-inner a { color: var(--blue); font-weight: 600; }
    .footer-inner a:hover { text-decoration: underline; }

    @media (max-width: 620px) {
      .container { width: min(960px, calc(100% - 32px)); }
      .nav-links { display: none; }
      .menu-button { display: block; }
      .mobile-nav { display: grid; gap: 2px; padding-bottom: 14px; }
      .mobile-nav a { padding: 8px 2px; color: var(--muted); font-size: 13px; font-weight: 600; }
      .mobile-nav a:last-child { color: var(--blue); }
      .hero { padding: 40px 0 32px; }
      .tools-grid { grid-template-columns: 1fr; }
    }
    .menu-button { display: none; width: 38px; height: 38px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); flex-shrink: 0; }
    .menu-button span { display: block; width: 16px; height: 1.5px; margin: 4px auto; background: var(--ink); border-radius: 1px; }
    .mobile-nav { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="../index.html" aria-label="Sheetflow home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">sheetflow</span>
        <span class="brand-sub">Tool Hub</span>
      </a>
      <div class="nav-links">
        <a href="../Main/index.html"><span class="btn-icon">&#9881;</span> Open workspace</a>
        <a href="../docs/tool-development.html"><span class="btn-icon">&#9998;</span> Build a tool</a>
      </div>
      <button class="menu-button" id="menuButton" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span>
      </button>
    </nav>
    <div class="mobile-nav container" id="mobileNav" hidden>
      <a href="../Main/index.html">Open workspace</a>
      <a href="../docs/tool-development.html">Build a tool</a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="hero-badge"><span class="hero-badge-dot"></span> Community tools</div>
      <h1>Extend <em>Sheetflow.</em></h1>
      <p>Download community and official tools for the Sheetflow workspace. Drop any .sf file into the workspace to install it.</p>
      <div class="hero-count" id="toolCount"></div>
    </div>
  </section>

  <section class="tools-section">
    <div class="container">
      <div class="filter-bar" id="filterBar"></div>
      <div class="tools-grid" id="toolsGrid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Sheetflow Tool Hub &middot; <a href="../docs/tool-development.html">Build your own tool</a></p>
      <p><a href="../index.html">Sheetflow</a></p>
    </div>
  </footer>

  <script>
    (function () {
      "use strict";

      var grid = document.getElementById("toolsGrid");
      var filterBar = document.getElementById("filterBar");
      var countEl = document.getElementById("toolCount");
      var allTools = [];
      var activeFilter = null;

      var menuButton = document.getElementById("menuButton");
      var mobileNav = document.getElementById("mobileNav");
      if (menuButton && mobileNav) {
        menuButton.addEventListener("click", function() {
          var isOpen = menuButton.getAttribute("aria-expanded") === "true";
          menuButton.setAttribute("aria-expanded", String(!isOpen));
          mobileNav.hidden = isOpen;
        });
        mobileNav.addEventListener("click", function(event) {
          if (event.target.closest("a")) {
            menuButton.setAttribute("aria-expanded", "false");
            mobileNav.hidden = true;
          }
        });
      }

      function escapeHTML(str) {
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function downloadTool(file, name) {
        fetch("./" + file)
          .then(function (r) { return r.blob(); })
          .then(function (blob) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = file;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          })
          .catch(function () {
            window.location.href = "./" + file;
          });
      }

      function getAllTags(tools) {
        var tagSet = {};
        tools.forEach(function (t) {
          (t.tags || []).forEach(function (tag) { tagSet[tag] = (tagSet[tag] || 0) + 1; });
        });
        return Object.keys(tagSet).sort().map(function (tag) {
          return { name: tag, count: tagSet[tag] };
        });
      }

      function renderFilters(tools) {
        var tags = getAllTags(tools);
        if (tags.length === 0) { filterBar.innerHTML = ""; return; }
        var html = '<button class="filter-btn filter-btn-active" data-tag="">All <span class="filter-btn-count">' + tools.length + '</span></button>';
        tags.forEach(function (t) {
          html += '<button class="filter-btn" data-tag="' + escapeHTML(t.name) + '">' + escapeHTML(t.name) + ' <span class="filter-btn-count">' + t.count + '</span></button>';
        });
        filterBar.innerHTML = html;
        filterBar.querySelectorAll(".filter-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            activeFilter = btn.dataset.tag || null;
            filterBar.querySelectorAll(".filter-btn").forEach(function (b) { b.classList.remove("filter-btn-active"); });
            btn.classList.add("filter-btn-active");
            renderTools(allTools);
          });
        });
      }

      function renderTools(tools) {
        var filtered = activeFilter
          ? tools.filter(function (t) { return (t.tags || []).indexOf(activeFilter) !== -1; })
          : tools;

        if (!filtered || filtered.length === 0) {
          grid.innerHTML = '<div class="empty-state">'
            + '<div class="empty-state-icon">&#128230;</div>'
            + '<h3>No tools found</h3>'
            + '<p>Drop <code>.sf</code> files into the <code>toolhub/</code> folder and run <code>node build.js</code>.</p>'
            + '</div>';
          countEl.innerHTML = '<strong>0</strong> tools available';
          return;
        }

        countEl.innerHTML = '<strong>' + filtered.length + '</strong> tool' + (filtered.length === 1 ? '' : 's') + (activeFilter ? ' matching "' + activeFilter + '"' : ' available');

        grid.innerHTML = filtered.map(function (tool) {
          var tags = (tool.tags || []).map(function (t) {
            var isActive = t === activeFilter;
            return '<span class="tool-tag' + (isActive ? ' tool-tag-active' : '') + '">' + escapeHTML(t) + '</span>';
          }).join("");

          return '<article class="tool-card">'
            + '<div class="tool-card-head">'
            + '<div class="tool-card-icon">' + (tool.icon || "&#9881;") + '</div>'
            + '<div class="tool-card-info">'
            + '<h3>' + escapeHTML(tool.name) + '</h3>'
            + '<div class="tool-card-meta">'
            + '<span>v' + escapeHTML(tool.version || "1.0.0") + '</span>'
            + (tool.author ? '<span>&middot; ' + escapeHTML(tool.author) + '</span>' : '')
            + '</div></div></div>'
            + '<p class="tool-card-desc">' + escapeHTML(tool.description || "") + '</p>'
            + (tags ? '<div class="tool-card-tags">' + tags + '</div>' : '')
            + '<div class="tool-card-actions">'
            + '<button class="btn btn-primary" data-download="' + escapeHTML(tool.file) + '" data-name="' + escapeHTML(tool.name) + '">&#8595; Download</button>'
            + '<button class="btn btn-ghost" data-preview="' + escapeHTML(tool.file) + '">&#128065; Preview</button>'
            + '</div></article>';
        }).join("");

        grid.querySelectorAll("[data-download]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            downloadTool(btn.dataset.download, btn.dataset.name);
          });
        });

        grid.querySelectorAll("[data-preview]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            fetch("./" + btn.dataset.preview)
              .then(function (r) { return r.text(); })
              .then(function (text) {
                var overlay = document.createElement("div");
                overlay.style.cssText = "position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px";
                overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });

                var panel = document.createElement("div");
                panel.style.cssText = "width:min(720px,100%);max-height:80vh;background:#0f172a;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.4)";

                var head = document.createElement("div");
                head.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06)";
                head.innerHTML = '<span style="color:rgba(255,255,255,.4);font-size:12px;font-family:monospace">' + escapeHTML(btn.dataset.preview) + '</span>';

                var closeBtn = document.createElement("button");
                closeBtn.textContent = "\u00d7";
                closeBtn.style.cssText = "background:none;border:none;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;padding:0 4px";
                closeBtn.addEventListener("click", function () { overlay.remove(); });
                head.appendChild(closeBtn);

                var pre = document.createElement("pre");
                pre.style.cssText = "margin:0;padding:16px;overflow:auto;flex:1;color:#e2e8f0;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;background:transparent";
                pre.textContent = text;

                panel.appendChild(head);
                panel.appendChild(pre);
                overlay.appendChild(panel);
                document.body.appendChild(overlay);
              });
          });
        });
      }

      fetch("./tools.json")
        .then(function (r) { return r.json(); })
        .then(function (tools) {
          allTools = tools;
          renderFilters(tools);
          renderTools(tools);
        })
        .catch(function () {
          grid.innerHTML = '<div class="empty-state">'
            + '<div class="empty-state-icon">&#9888;</div>'
            + '<h3>Could not load tools</h3>'
            + '<p>Make sure <code>tools.json</code> exists in the toolhub folder.</p>'
            + '</div>';
        });
    })();
  </script>
</body>
</html>
